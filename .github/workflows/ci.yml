name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # the oldest supported Python and the newest; ubuntu-latest (26.04) has no 3.9 build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q
