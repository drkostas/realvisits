[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realvisits"
version = "0.1.0"
description = "Sort the visits a website records into people, bots and the site's own checks, at read time"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = []
keywords = ["analytics", "bots", "visitors", "user-agent", "crawler", "self-hosted"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: Log Analysis"]

[project.urls]
Homepage = "https://github.com/drkostas/realvisits"

[project.scripts]
realvisits = "realvisits.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realvisits = ["data/*.txt"]

[tool.pytest.ini_options]
# the checkout under test, ahead of any installed copy of the package
pythonpath = ["src"]
